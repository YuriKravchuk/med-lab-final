<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Редагувати послугу</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<h2>Редагувати послугу</h2>
<form th:action="@{/services/edit/{id}(id=${medicalAnalysis.id})}" th:object="${medicalAnalysis}" method="post">
  <label>Назва:</label>
  <input type="text" th:field="*{name}"/>
  <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></div>

  <br/>

  <label>Ціна:</label>
  <input type="number" step="0.01" th:field="*{price}"/>
  <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="error"></div>

  <br/>

  <label>Термін виконання (год):</label>
  <input type="number" th:field="*{executionTime}"/>
  <div th:if="${#fields.hasErrors('executionTime')}" th:errors="*{executionTime}" class="error"></div>

  <br/>

  <button type="submit">Оновити</button>
</form>
<a href="/services">Назад до списку</a>
</body>
</html>
