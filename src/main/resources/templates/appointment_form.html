<form th:action="@{/appointments/form}" th:object="${appointment}" method="post">
  Прізвище: <input type="text" th:field="*{lastName}" />
  <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div><br/>

  Ім'я: <input type="text" th:field="*{firstName}" />
  <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div><br/>

  Телефон: <input type="text" th:field="*{phone}" />
  <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div><br/>

  Email: <input type="email" th:field="*{email}" />
  <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div><br/>

  <label for="services">Оберіть послуги зі знижкою 10%:</label><br>
  <select th:field="*{services}" id="services" multiple="multiple">
    <option th:each="service : ${services}"
            th:value="${service.id}"
            th:text="${service.name + ' - ' + (#numbers.formatDecimal(service.price*0.9, 0, 2)) + ' грн'}">
    </option>
  </select>
  <div class="error" th:if="${serviceError}" th:text="${serviceError}"></div><br/>

  Дата візиту: <input type="date" th:field="*{date}" id="date" />
  <div class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div><br/>

  Час візиту:
  <select th:field="*{time}" id="time">
    <option value="">Оберіть час</option>
  </select>
  <div class="error" th:if="${#fields.hasErrors('time')}" th:errors="*{time}"></div><br/>

  <button type="submit">Записатись</button>
</form>


<a href="/">На головну</a>

<script>
  document.getElementById("date").addEventListener("change", function () {
    fetch('/appointments/taken-times?date=' + this.value)
            .then(res => res.json())
            .then(data => {
              const timeSelect = document.getElementById("time");
              timeSelect.innerHTML = '<option value="">Оберіть час</option>'; // очищення

              const all = ["08:00", "09:00", "10:00", "11:00", "12:00"];
              const taken = data.map(t => t.substring(0, 5)); // обрізаємо секунди, якщо приходять
              const free = all.filter(t => !taken.includes(t));

              free.forEach(time => {
                const option = document.createElement("option");
                option.value = time;
                option.textContent = time;
                timeSelect.appendChild(option);
              });
            });
  });
</script>

</script>
